<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI ZEN Overlay</title>
<style>
:root{--s:#d1d5db;--w:#f8fafc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif;color:var(--w)}
.stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:30px}.wrap{width:min(950px,96vw);animation:rise .8s ease-out both}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 12px 6px}.mark{width:34px;height:34px;border:1px solid var(--s);display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 0 18px #d1d5db35}.mark b{transform:rotate(-45deg);font-size:15px}.name{font-weight:900;letter-spacing:.32em;font-size:18px}.sub{color:#9299a5;font-size:9px;letter-spacing:.3em;margin-top:3px}
.panel{position:relative;overflow:hidden;padding:20px 22px 17px;border:1px solid #cbd0d944;border-radius:13px;background:linear-gradient(110deg,rgba(8,9,12,.9),rgba(28,30,35,.78),rgba(8,9,12,.9));box-shadow:0 12px 50px #0008,inset 0 1px #ffffff15;backdrop-filter:blur(12px)}.panel:before{content:"";position:absolute;top:0;left:-35%;height:1px;width:35%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:sweep 5s infinite}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat{min-width:0;padding:0 8px}.stat+.stat{border-left:1px solid #ffffff18;padding-left:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.label{font-size:10px;letter-spacing:.23em;color:#b8bec8;font-weight:bold}.dot{width:5px;height:5px;border-radius:50%;background:var(--s);box-shadow:0 0 10px var(--s)}.numbers{display:flex;align-items:baseline;gap:5px;font-weight:bold;white-space:nowrap}.value{font-size:clamp(23px,4vw,35px);font-variant-numeric:tabular-nums}.goal{color:#737b87;font-size:11px}.track{height:5px;background:#ffffff17;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#7e8794,#f8fafc);border-radius:10px;box-shadow:0 0 12px #d1d5db80;transition:width .6s}.foot{display:flex;justify-content:space-between;margin:14px 3px 0;color:#858c98;font-size:9px;letter-spacing:.2em}.live{color:#e7e9ed}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--s);margin-right:7px;box-shadow:0 0 9px var(--s);animation:pulse 1.5s infinite}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes sweep{0%,20%{left:-35%}65%,100%{left:110%}}@keyframes pulse{50%{opacity:.3}}@media(max-width:600px){.stage{padding:12px}.panel{padding:14px 9px}.grid{gap:8px}.stat{padding:0 4px}.stat+.stat{padding-left:10px}.label{font-size:8px}.value{font-size:22px}.goal{font-size:9px}}
</style></head><body><div class="stage"><main class="wrap">
<header class="brand"><div class="mark"><b>KZ</b></div><div><div class="name">KAI ZEN</div><div class="sub">FOCUS · DISCIPLINE · VICTORY</div></div></header>
<section class="panel"><div class="grid">
<div class="stat" data-key="likes"><div class="top"><span class="label">LIKES</span><i class="dot"></i></div><div class="numbers"><span class="value">0</span><span class="goal">/ 1,000</span></div><div class="track"><div class="fill"></div></div></div>
<div class="stat" data-key="follows"><div class="top"><span class="label">FOLLOWERS</span><i class="dot"></i></div><div class="numbers"><span class="value">0</span><span class="goal">/ 50</span></div><div class="track"><div class="fill"></div></div></div>
<div class="stat" data-key="shares"><div class="top"><span class="label">SHARES</span><i class="dot"></i></div><div class="numbers"><span class="value">0</span><span class="goal">/ 100</span></div><div class="track"><div class="fill"></div></div></div>
</div><div class="foot"><span>ZEN MODE ACTIVATED</span><span class="live">LIVE SESSION</span></div></section></main></div>
<script>
const goals={likes:1000,follows:50,shares:100},counts={likes:0,follows:0,shares:0};
function render(){for(const k in goals){let e=document.querySelector('[data-key="'+k+'"]');e.querySelector('.value').textContent=counts[k].toLocaleString('en-US');e.querySelector('.fill').style.width=Math.min(100,counts[k]/goals[k]*100)+'%'}}
function add(k,n){counts[k]=Math.max(0,counts[k]+n);render()}
document.addEventListener('keydown',e=>{if(e.repeat)return;let n=e.shiftKey?-1:1;if(e.key==='1')add('likes',n);if(e.key==='2')add('follows',n);if(e.key==='3')add('shares',n);if(e.key.toLowerCase()==='r'){counts.likes=counts.follows=counts.shares=0;render()}});
render();
</script></body></html>
